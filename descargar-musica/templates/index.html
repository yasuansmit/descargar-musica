<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efebff; --paper:#ffffff; --ink:#1e1646; --muted:#5f5990; --line:#dcd5f6;
  --accent:#d6246e; --accent-ink:#ffffff; --label:#ffc93c; --danger:#b3261e; --ok:#14784a;
  --shadow:0 .6rem 1.6rem -.6rem rgba(30,22,70,.35);
  --g1:#0e0a1f; --g2:#1d1638; --rim:transparent;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#150f2b; --paper:#211845; --ink:#f1ecff; --muted:#a9a0d6; --line:#382d6b;
  --accent:#ff5ca8; --accent-ink:#2a0d1b; --danger:#ff8a80; --ok:#5fd39b;
  --shadow:0 .6rem 1.6rem -.6rem rgba(0,0,0,.7);
  --g1:#241b4a; --g2:#3a2d70; --rim:#4b3d8f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 "Bricolage Grotesque",system-ui,sans-serif;
  display:flex;justify-content:center;padding:clamp(1.5rem,5vw,3.5rem) 1.25rem 4rem;overflow-x:hidden}
main{width:100%;max-width:40rem;position:relative}
[hidden]{display:none!important}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* portada: el disco es lo memorable */
.hero{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2rem}
h1{font-size:clamp(2.9rem,12vw,4.6rem);line-height:.92;letter-spacing:-.045em;font-weight:800;margin:0 0 .9rem}
.lead{color:var(--muted);margin:0;max-width:20rem}
.by{display:inline-block;margin:1rem 0 0;padding:.2rem .85rem;border-radius:2rem;font-weight:700;font-size:.95rem;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.record{position:relative;flex:none;width:clamp(8.5rem,32vw,12.5rem);aspect-ratio:1}
.vinyl{position:absolute;left:0;bottom:0;width:84%;aspect-ratio:1;border-radius:50%;transition:box-shadow .8s;box-shadow:var(--shadow),0 0 0 2px var(--rim);
  background:repeating-radial-gradient(circle,var(--g1) 0 2px,var(--g2) 3px 4px)}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 25deg,#0000 0 9%,rgba(255,255,255,.22) 13%,#0000 19% 59%,rgba(255,255,255,.16) 63%,#0000 69%)}
.vinyl::after{content:"";position:absolute;inset:33%;border-radius:50%;
  background:radial-gradient(circle,#150f2b 0 7%,var(--label) 8%);box-shadow:0 0 0 .2rem rgba(0,0,0,.25)}
.busy .vinyl{animation:spin 2.8s linear infinite;
  box-shadow:var(--shadow),0 0 0 2px var(--rim),0 0 2.4rem color-mix(in srgb,var(--accent) 60%,transparent)}
.armsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.arm{transform-box:view-box;transform-origin:90px 10px;transform:rotate(-50deg);transition:transform 1.1s cubic-bezier(.3,.8,.25,1)}
.busy .arm{transform:rotate(0deg)}
.arm line{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.arm .head{fill:var(--accent)}
.pivot{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.record.ping::after{content:"";position:absolute;left:0;bottom:0;width:84%;aspect-ratio:1;border-radius:50%;
  border:3px solid var(--accent);animation:ping .9s ease-out forwards;pointer-events:none}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* controles */
button,select{font:inherit}
button{cursor:pointer;border:0;border-radius:.9rem;padding:.8rem 1.3rem;background:var(--accent);color:var(--accent-ink);
  font-weight:700;transition:transform .1s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.07)}
button:active:not(:disabled){transform:translateY(1px)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-weight:600}
button.ghost:hover:not(:disabled){border-color:var(--accent);filter:none}
button.sm{padding:.3rem .8rem;font-size:.9rem;border-radius:.65rem}
button:disabled{opacity:.5;cursor:default}
select{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:.9rem;padding:.7rem .75rem;font-weight:600}
input[type=text]{font:inherit;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:.9rem;padding:.65rem .9rem;width:100%}

.field{display:flex;align-items:center;gap:.5rem;background:var(--paper);border:2px solid var(--line);
  border-radius:1.2rem;padding:.4rem .4rem .4rem 1.1rem;box-shadow:var(--shadow);transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field input[type=text]{flex:1;min-width:0;border:0;background:transparent;padding:.65rem 0;font-size:1.1rem}
.field input:focus-visible{outline:none}
.field input::placeholder{color:var(--muted)}
.field button{padding:.85rem 1.5rem;border-radius:.85rem}
.msg{min-height:1.5rem;margin:.8rem .25rem 0;color:var(--muted)}
.msg.error{color:var(--danger)}

section,details{margin-top:1.75rem}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.8rem}
h2{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-.01em}
.chk{display:flex;align-items:flex-start;gap:.6rem;color:var(--muted);font-size:.95rem;margin:0 .25rem .6rem;cursor:pointer}
.chk span{overflow-wrap:anywhere}
.chk input,.rowlab>input{appearance:none;flex:none;width:1.4rem;height:1.4rem;margin:0;border:2px solid var(--muted);border-radius:.45rem;
  display:grid;place-content:center;cursor:pointer;background:transparent}
.chk input::after,.rowlab>input::after{content:"";width:.7rem;height:.38rem;border-left:3px solid var(--accent-ink);
  border-bottom:3px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.chk input:checked,.rowlab>input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after,.rowlab>input:checked::after{opacity:1}

.panel{background:var(--paper);border-radius:1.3rem;overflow:hidden;box-shadow:var(--shadow)}
.rows li+li,.hist li+li,.q+.q{border-top:1px solid var(--line)}
.rowlab{display:grid;grid-template-columns:auto 6.25rem 1fr auto;gap:.9rem;align-items:center;padding:.7rem 1rem;cursor:pointer;transition:background .15s}
.rowlab:hover{background:color-mix(in srgb,var(--accent) 5%,var(--paper))}
.rowlab:has(input:checked){background:color-mix(in srgb,var(--accent) 11%,var(--paper))}
.thumb{position:relative;aspect-ratio:16/9;border-radius:.6rem;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:.25rem;bottom:.25rem;background:rgba(10,6,30,.82);color:#fff;font-size:.72rem;font-weight:600;padding:0 .35rem;border-radius:.3rem}
.rowlab button{white-space:nowrap}
.player{display:block;width:calc(100% - 2rem);height:12rem;border:0;border-radius:.7rem;margin:.1rem 1rem 1rem}
.t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:.93rem}

.dock{position:sticky;bottom:1rem;z-index:5;margin-top:1rem;display:flex;align-items:center;gap:.6rem;padding:.55rem;
  background:var(--paper);border:2px solid var(--line);border-radius:1.2rem;box-shadow:var(--shadow)}
.dock #dl{flex:1}
#more{margin-top:1rem;width:100%}

/* cola: portada con el vinilo asomando */
.q{display:grid;grid-template-columns:4.4rem 1fr;gap:1rem;align-items:center;padding:.9rem 1.1rem}
.cover{position:relative;width:3.6rem;height:3.6rem}
.disc{position:absolute;inset:.25rem -.8rem .25rem .3rem;border-radius:50%;transform:translateX(.35rem);
  background:radial-gradient(circle,var(--label) 0 18%,#0000 19%),repeating-radial-gradient(circle,var(--g1) 0 2px,var(--g2) 3px 4px)}
.disc.spin{animation:dspin 1.6s linear infinite}
@keyframes dspin{to{transform:translateX(.35rem) rotate(360deg)}}
.cover img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:.5rem;display:block;background:var(--line)}
.track{height:.45rem;border-radius:1rem;background:var(--line);overflow:hidden;margin:.4rem 0 .25rem}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:1rem;transition:width .4s}
.foot{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.q.done .track i{background:var(--ok)}
.q.err .st{color:var(--danger)}
.q.done .st{color:var(--ok)}

details{background:var(--paper);border-radius:1.3rem;padding:1rem 1.2rem;box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:700;font-size:1.15rem}
.hbar{display:flex;gap:.5rem;margin:.9rem 0 .4rem}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.65rem 0}
.hist .t{font-weight:500}
footer{margin-top:2.5rem;display:flex;align-items:center;justify-content:center;gap:.75rem;color:var(--muted);font-size:.9rem}

@media (max-width:30rem){
  .rowlab{grid-template-columns:auto 4.6rem 1fr auto;padding:.7rem .75rem;gap:.6rem}
  .lbl{display:none}
  .record{width:7.5rem}
}
@media (prefers-reduced-motion:reduce){.busy .vinyl,.disc.spin,.record.ping::after{animation:none}.track i,.arm{transition:none}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <h1>Mi música</h1>
      <p class="lead">Busca una canción o pega el link de un video o una playlist.</p>
      <p class="by">By: Yasuan</p>
    </div>
    <div class="record" id="deck" aria-hidden="true">
      <div class="vinyl"></div>
      <svg class="armsvg" viewBox="0 0 100 100">
        <g class="arm">
          <line x1="90" y1="10" x2="57" y2="42"/>
          <rect class="head" x="-5" y="-2.6" width="10" height="5.2" rx="1.4" transform="translate(57 42) rotate(136)"/>
        </g>
        <circle class="pivot" cx="90" cy="10" r="6.5"/>
        <circle cx="90" cy="10" r="2" fill="var(--accent)"/>
      </svg>
    </div>
  </header>

  <form id="form" class="field">
    <input id="q" type="text" placeholder="Nombre de la canción o link de YouTube" autocomplete="off" aria-label="Canción o link" autofocus>
    <button id="go" type="submit">Buscar</button>
  </form>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>

  <section id="results" hidden>
    <div class="bar-top">
      <h2 id="rtitle"></h2>
      <button id="all" class="ghost sm" type="button">Seleccionar todas</button>
    </div>
    <label class="chk"><input type="checkbox" id="tomusic"> <span>Guardar directo en mi carpeta de Música <span id="mdir"></span></span></label>
    <label id="filter" class="chk"><input type="checkbox" id="short"> <span>Ocultar videos de más de 10 minutos <span id="hid"></span></span></label>
    <ul id="rows" class="rows panel"></ul>
    <div class="dock">
      <select id="quality" aria-label="Calidad">
        <option value="128">128 kbps</option><option value="192" selected>192 kbps</option><option value="320">320 kbps</option>
      </select>
      <button id="dl" type="button">Descargar</button>
    </div>
    <button id="more" class="ghost" type="button" hidden>Ver más resultados</button>
  </section>

  <section id="queueBox" hidden>
    <div class="bar-top"><h2>Descargas</h2></div>
    <ul id="queue" class="panel"></ul>
  </section>

  <details id="histBox">
    <summary id="histSum">Historial</summary>
    <div class="hbar">
      <input id="hq" type="text" placeholder="Buscar en el historial" aria-label="Buscar en el historial">
      <button id="hclear" class="ghost" type="button">Borrar</button>
    </div>
    <ul id="hist" class="hist"></ul>
  </details>

  <footer><span id="ver"></span><button id="upd" class="ghost sm" type="button">Actualizar yt-dlp</button></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const fmt = s => s ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "";
const say = (t, err=false) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " error" : ""); };
const LONG = 600;

let items = [], picked = new Set(), jobs = [], timer = null, lastQ = "", count = 15;

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)} : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Algo salió mal. Inténtalo de nuevo.");
  return j;
}

/* ---------- buscar / resolver ---------- */
async function search(more = false){
  const q = more ? lastQ : $("q").value.trim();
  if (!q) return;
  if (more) count += 15; else { count = 15; lastQ = q; }
  $("go").disabled = true; $("more").disabled = true;
  say(more ? "Cargando más resultados…" : /^https?:/i.test(q) ? "Leyendo el link…" : "Buscando…");
  try {
    const d = await api("/api/resolve", {q, count});
    if (more) {
      const seen = new Set(items.map(i => i.url));
      const fresh = d.items.filter(i => !seen.has(i.url));
      items = items.concat(fresh);
      $("more").hidden = fresh.length === 0 || count >= 60;
    } else {
      items = d.items;
      picked = new Set(d.kind === "search" ? [] : items.map((_, i) => i));
      $("rtitle").textContent = d.kind === "playlist" ? `${d.title} (${items.length})` : d.kind === "video" ? "Video" : "Resultados";
      $("short").checked = d.kind === "search";
      $("filter").hidden = d.kind === "video";
      $("more").hidden = d.kind !== "search";
    }
    renderRows(); say("");
  } catch (e){ say(e.message, true); }
  finally { $("go").disabled = false; $("more").disabled = false; }
}

const show = it => !$("short").checked || !it.duration || it.duration <= LONG;
const vis = () => items.map((_, i) => i).filter(i => show(items[i]));

function renderRows(){
  const v = vis();
  picked = new Set([...picked].filter(i => v.includes(i)));
  $("hid").textContent = items.length > v.length ? `(${items.length - v.length} ocultos)` : "";
  $("rows").replaceChildren(...v.map(row));
  $("results").hidden = false; updateBtn();
}

function row(i){
  const it = items[i], li = el("li"), lab = el("label", "rowlab"), cb = el("input");
  cb.type = "checkbox"; cb.checked = picked.has(i);
  cb.onchange = () => { cb.checked ? picked.add(i) : picked.delete(i); updateBtn(); };
  const th = el("div", "thumb"), img = el("img"); img.src = it.thumbnail; img.alt = ""; img.loading = "lazy";
  th.append(img); if (it.duration) th.append(el("span", "dur", fmt(it.duration)));
  const box = el("div"), play = el("button", "ghost sm"); play.type = "button"; play.setAttribute("aria-label", "Escuchar");
  play.append("▶", el("span", "lbl", " Escuchar"));
  play.onclick = e => { e.preventDefault(); togglePlayer(li, it); };
  box.append(el("div", "t", it.title), el("div", "s", it.channel));
  lab.append(cb, th, box, play); li.append(lab); return li;
}

function togglePlayer(li, it){
  const had = li.querySelector("iframe");
  document.querySelectorAll("#rows iframe").forEach(f => f.remove());
  if (had) return;
  const f = el("iframe", "player");
  f.src = `https://www.youtube.com/embed/${new URL(it.url).searchParams.get("v")}?autoplay=1`;
  f.allow = "autoplay; encrypted-media"; f.referrerPolicy = "strict-origin-when-cross-origin";
  f.title = "Vista previa"; li.append(f);
}

function updateBtn(){
  const n = vis().length;
  $("dl").disabled = picked.size === 0;
  $("dl").textContent = picked.size > 1 ? `Descargar ${picked.size}` : "Descargar";
  $("all").hidden = n < 2;
  $("all").textContent = picked.size === n ? "Quitar selección" : "Seleccionar todas";
}

$("form").addEventListener("submit", e => { e.preventDefault(); search(); });
$("more").onclick = () => search(true);
$("short").onchange = renderRows;
$("q").addEventListener("paste", () => setTimeout(() => /^https?:/i.test($("q").value.trim()) && search(), 0));
$("all").onclick = () => { const v = vis(); picked = picked.size === v.length ? new Set() : new Set(v); renderRows(); };

/* ---------- cola de descargas ---------- */
$("dl").onclick = async () => {
  const chosen = [...picked].sort((a, b) => a - b).map(i => items[i]);
  picked = new Set(); renderRows();
  for (const it of chosen) await addJob(it);
};

async function addJob(it){
  const li = el("li", "q"), cover = el("div", "cover"), disc = el("div", "disc"), img = el("img");
  img.src = it.thumbnail; img.alt = ""; cover.append(disc, img);
  const body = el("div"), track = el("div", "track"), bar = el("i"), foot = el("div", "foot");
  const st = el("div", "s st", "En cola"), act = el("button", "ghost sm", "Cancelar"); act.type = "button";
  track.append(bar); foot.append(st, act); body.append(el("div", "t", it.title), track, foot);
  li.append(cover, body); $("queue").prepend(li); $("queueBox").hidden = false;
  const job = {li, disc, bar, st, act, it, final: false, id: null};
  act.onclick = () => {
    if (job.final) { li.remove(); jobs = jobs.filter(j => j !== job); addJob(it); }
    else { act.disabled = true; st.textContent = "Cancelando…"; if (job.id) api(`/api/jobs/${job.id}/cancel`, {}).catch(() => {}); }
  };
  try {
    job.id = (await api("/api/jobs", {url: it.url, title: it.title, quality: $("quality").value, save: $("tomusic").checked})).id;
    jobs.push(job); syncBusy(); if (!timer) timer = setInterval(poll, 1000);
  } catch (e){ finish(job, "err", e.message); }
}

const syncBusy = () => document.body.classList.toggle("busy", jobs.some(j => !j.final));

function finish(job, cls, text){
  job.final = true; syncBusy();
  if (cls === "done") { const d = $("deck"); d.classList.remove("ping"); void d.offsetWidth; d.classList.add("ping"); setTimeout(() => d.classList.remove("ping"), 1000); } job.li.classList.add(cls); job.st.textContent = text;
  job.disc.classList.remove("spin"); job.act.disabled = false;
  job.act.textContent = "Reintentar"; job.act.hidden = cls === "done";
}

async function poll(){
  for (const job of jobs.filter(j => !j.final)){
    try {
      const j = await api(`/api/jobs/${job.id}`);
      job.bar.style.width = j.percent + "%";
      if (j.status === "downloading") { job.st.textContent = `Descargando ${j.percent}%`; job.disc.classList.add("spin"); }
      else if (j.status === "converting") { job.st.textContent = "Convirtiendo y agregando portada…"; job.disc.classList.add("spin"); }
      else if (j.status === "done") {
        finish(job, "done", j.saved ? `Guardada en Música: ${j.saved}` : "Listo");
        addHist({...job.it, title: j.name || job.it.title});
        if (!j.saved) {
          const a = el("a"); a.href = `/api/jobs/${job.id}/file`; a.download = "";
          document.body.append(a); a.click(); a.remove();
        }
      }
      else if (j.status === "cancelled") finish(job, "err", "Cancelada");
      else if (j.status === "error") finish(job, "err", j.error || "No se pudo descargar.");
    } catch (e){ finish(job, "err", e.message); }
  }
  if (jobs.every(j => j.final)) { clearInterval(timer); timer = null; }
}

/* ---------- historial (se guarda en este navegador) ---------- */
const loadH = () => { try { return JSON.parse(localStorage.getItem("hist")) || []; } catch { return []; } };
const saveH = h => { try { localStorage.setItem("hist", JSON.stringify(h)); } catch {} };

function addHist(it){
  const h = loadH().filter(x => x.url !== it.url);
  h.unshift({url: it.url, title: it.title, channel: it.channel, thumbnail: it.thumbnail, date: Date.now()});
  saveH(h.slice(0, 200)); renderHist();
}

function renderHist(){
  const all = loadH(), f = $("hq").value.trim().toLowerCase();
  const h = all.filter(x => !f || x.title.toLowerCase().includes(f));
  $("histSum").textContent = `Historial (${all.length})`;
  $("hist").replaceChildren(...h.map(x => {
    const li = el("li"), box = el("div"), b = el("button", "ghost sm", "Descargar de nuevo"); b.type = "button";
    box.append(el("div", "t", x.title), el("div", "s", new Date(x.date).toLocaleDateString()));
    b.onclick = () => addJob(x); li.append(box, b); return li;
  }));
}
$("hq").oninput = renderHist;
$("hclear").onclick = () => { if (confirm("¿Borrar todo el historial?")) { saveH([]); renderHist(); } };
renderHist();

/* ---------- versión de yt-dlp ---------- */
api("/api/version").then(v => { $("ver").textContent = `yt-dlp ${v.version}`; $("mdir").textContent = v.music_dir ? `(${v.music_dir})` : "";
  if (v.local === false) { // quien entra desde fuera no ve lo que es solo del dueño
    $("tomusic").checked = false; $("tomusic").closest("label").hidden = true; $("upd").hidden = true;
  }
}).catch(() => {});

/* ---------- preferencia: guardar en Música ---------- */
try { $("tomusic").checked = localStorage.getItem("tomusic") !== "0"; } catch { $("tomusic").checked = true; }
$("tomusic").onchange = () => { try { localStorage.setItem("tomusic", $("tomusic").checked ? "1" : "0"); } catch {} };
$("upd").onclick = async () => {
  $("upd").disabled = true; say("Actualizando yt-dlp… puede tardar un momento.");
  try {
    const r = await fetch("/api/update", {method: "POST", headers: {"X-Requested-With": "app"}});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "No se pudo actualizar.");
    $("ver").textContent = `yt-dlp ${j.version}`;
    say(j.restart ? "Actualizado. Cierra la app (Ctrl+C) y ábrela de nuevo con py app.py." : "Ya tienes la última versión.");
  } catch (e){ say(e.message, true); }
  finally { $("upd").disabled = false; }
};
</script>
</body>
</html>
